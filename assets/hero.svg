<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Aadityasinh Zala, DevOps and Cloud Infrastructure Engineer. Illustration of a developer sitting on a cloud with a laptop, above a cloud layer at dawn.">
  <title>Aadityasinh Zala — DevOps · Cloud · SRE</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#070b14"/>
      <stop offset="42%"  stop-color="#0f1729"/>
      <stop offset="76%"  stop-color="#1c2542"/>
      <stop offset="100%" stop-color="#2c3862"/>
    </linearGradient>

    <radialGradient id="dawn" cx="0.26" cy="1.02" r="0.8">
      <stop offset="0%"   stop-color="#ff9a62" stop-opacity="0.5"/>
      <stop offset="42%"  stop-color="#ff7e4d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff7e4d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd68a" stop-opacity="0.85"/>
      <stop offset="45%"  stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glowSm" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <!-- reusable cloud silhouettes -->
    <g id="cloudA">
      <circle cx="42"  cy="44" r="26"/>
      <circle cx="84"  cy="30" r="34"/>
      <circle cx="128" cy="42" r="25"/>
      <circle cx="160" cy="52" r="17"/>
      <rect x="16" y="46" width="152" height="24" rx="12"/>
    </g>
    <g id="cloudB">
      <circle cx="30" cy="32" r="19"/>
      <circle cx="60" cy="22" r="25"/>
      <circle cx="92" cy="32" r="18"/>
      <rect x="12" y="32" width="96" height="18" rx="9"/>
    </g>
    <style>
      @keyframes bob    { 0%,100%{transform:translateY(0)}     50%{transform:translateY(-5px)} }
      @keyframes bobSlow{ 0%,100%{transform:translateY(0)}     50%{transform:translateY(-8px)} }
      @keyframes drift  { from{transform:translateX(-70px)}    to{transform:translateX(1290px)} }
      @keyframes twinkle{ 0%,100%{opacity:.15}                 50%{opacity:.95} }
      @keyframes pulse  { 0%,100%{opacity:.55; transform:scale(.96)} 50%{opacity:1; transform:scale(1.06)} }
      @keyframes flow   { from{stroke-dashoffset:44}           to{stroke-dashoffset:0} }
      @keyframes beat   { 0%,100%{opacity:.35}                 50%{opacity:1} }

      .bob     { animation: bob 6s ease-in-out infinite; }
      .bob-s   { animation: bobSlow 9s ease-in-out infinite; }
      .star    { animation: twinkle 4s ease-in-out infinite; }
      .glow    { animation: pulse 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .wire    { animation: flow 2.2s linear infinite; }
      .beat    { animation: beat 2s ease-in-out infinite; }
      .drift-1 { animation: drift 46s linear infinite; }
      .drift-2 { animation: drift 68s linear infinite; }
      .drift-3 { animation: drift 92s linear infinite; }
    </style>
  </defs>

  <!-- ─── sky ─────────────────────────────────────────────── -->
  <rect width="1200" height="340" fill="url(#sky)"/>
  <rect width="1200" height="340" fill="url(#dawn)"/>

  <!-- ─── stars ───────────────────────────────────────────── -->
  <g fill="#dce6ff">
    <circle class="star" cx="88"   cy="42"  r="1.5" style="animation-delay:0s"/>
    <circle class="star" cx="176"  cy="86"  r="1"   style="animation-delay:1.4s"/>
    <circle class="star" cx="262"  cy="34"  r="1.7" style="animation-delay:2.6s"/>
    <circle class="star" cx="352"  cy="66"  r="1.1" style="animation-delay:.7s"/>
    <circle class="star" cx="444"  cy="30"  r="1.4" style="animation-delay:3.1s"/>
    <circle class="star" cx="520"  cy="94"  r="1"   style="animation-delay:1.9s"/>
    <circle class="star" cx="596"  cy="46"  r="1.6" style="animation-delay:.3s"/>
    <circle class="star" cx="684"  cy="28"  r="1.1" style="animation-delay:2.2s"/>
    <circle class="star" cx="772"  cy="72"  r="1.3" style="animation-delay:3.6s"/>
    <circle class="star" cx="858"  cy="38"  r="1"   style="animation-delay:1.1s"/>
    <circle class="star" cx="944"  cy="88"  r="1.5" style="animation-delay:2.9s"/>
    <circle class="star" cx="1032" cy="34"  r="1.2" style="animation-delay:.5s"/>
    <circle class="star" cx="1108" cy="70"  r="1.6" style="animation-delay:3.9s"/>
    <circle class="star" cx="1160" cy="26"  r="1"   style="animation-delay:1.7s"/>
    <circle class="star" cx="132"  cy="118" r="1"   style="animation-delay:2.4s"/>
    <circle class="star" cx="640"  cy="112" r="1"   style="animation-delay:4.2s"/>
  </g>

  <!-- ─── far cloud layer (slow, dim) ─────────────────────── -->
  <g opacity="0.16" fill="#8ea6d8">
    <g class="drift-3"><use href="#cloudB" transform="translate(60,150) scale(.8)"/></g>
    <g class="drift-3" style="animation-delay:-30s"><use href="#cloudB" transform="translate(700,128) scale(1.05)"/></g>
    <g class="drift-3" style="animation-delay:-62s"><use href="#cloudA" transform="translate(980,158) scale(.7)"/></g>
  </g>

  <!-- ─── mid cloud layer ─────────────────────────────────── -->
  <g opacity="0.3" fill="#6f88c4">
    <g class="drift-2"><use href="#cloudB" transform="translate(120,214) scale(1.15)"/></g>
    <g class="drift-2" style="animation-delay:-34s"><use href="#cloudA" transform="translate(760,196) scale(.85)"/></g>
  </g>

  <!-- ─── small companion clouds ──────────────────────────── -->
  <g fill="#5872ab" opacity="0.72">
    <g class="bob-s"><use href="#cloudB" transform="translate(28,176) scale(.62)"/></g>
    <g class="bob-s" style="animation-delay:-3s"><use href="#cloudB" transform="translate(470,124) scale(.5)"/></g>
    <g class="bob"   style="animation-delay:-5s"><use href="#cloudB" transform="translate(520,244) scale(.72)"/></g>
    <g class="bob"   style="animation-delay:-2s"><use href="#cloudB" transform="translate(146,138) scale(.4)"/></g>
    <g class="bob-s" style="animation-delay:-7s"><use href="#cloudB" transform="translate(432,206) scale(.34)"/></g>
  </g>

  <!-- ─── main cloud + developer ──────────────────────────── -->
  <g class="bob">
    <!-- soft underglow so the cloud sits in the light -->
    <ellipse cx="352" cy="326" rx="188" ry="28" fill="#ff9a62" opacity="0.2" filter="url(#soften)"/>

    <g transform="translate(160,200)">
      <!-- base silhouette -->
      <g fill="#6d86c4">
        <circle cx="80"  cy="82" r="42"/>
        <circle cx="156" cy="62" r="54"/>
        <circle cx="236" cy="72" r="46"/>
        <circle cx="308" cy="88" r="33"/>
        <rect x="38" y="80" width="308" height="48" rx="24"/>
      </g>
      <!-- lit puff tops -->
      <g fill="#a9bde9" opacity="0.8">
        <circle cx="158" cy="54" r="44"/>
        <circle cx="238" cy="64" r="35"/>
        <circle cx="82"  cy="74" r="31"/>
      </g>
      <g fill="#c7d6f4" opacity="0.55">
        <circle cx="160" cy="46" r="30"/>
        <circle cx="240" cy="58" r="21"/>
      </g>
      <!-- underside in shade, then the warm dawn rim beneath it -->
      <rect x="46" y="102" width="292" height="26" rx="13" fill="#54689f"/>
      <rect x="54" y="114" width="276" height="14" rx="7"  fill="#ff9a62" opacity="0.26"/>
    </g>

    <!-- seat shadow -->
    <ellipse cx="316" cy="214" rx="46" ry="10" fill="#31406e" opacity="0.5"/>

    <!-- developer -->
    <g transform="translate(235,61) scale(1.3)">
      <!-- far leg -->
      <g fill="#27314f">
        <rect x="50" y="100" width="58" height="20" rx="10" transform="rotate(-6 50 110)"/>
        <rect x="98" y="112" width="17" height="42" rx="8" transform="rotate(4 98 112)"/>
        <ellipse cx="112" cy="156" rx="13" ry="7" fill="#161d33"/>
      </g>

      <!-- neck -->
      <rect x="79" y="50" width="13" height="12" rx="5" fill="#d9a87f"/>

      <!-- hoodie torso -->
      <path d="M50 120 C44 96 46 72 58 62 C66 55 80 53 88 59 C96 67 97 93 95 114 C95 122 84 126 70 126 C58 126 52 125 50 120 Z" fill="#8b7ad6"/>
      <!-- hood behind neck -->
      <path d="M60 64 C64 54 80 50 90 56 C84 66 70 70 60 64 Z" fill="#7263bd"/>

      <!-- near leg -->
      <g fill="#2f3a5c">
        <rect x="58" y="102" width="60" height="21" rx="10" transform="rotate(-6 58 112)"/>
        <rect x="108" y="114" width="18" height="44" rx="9" transform="rotate(5 108 114)"/>
        <ellipse cx="124" cy="160" rx="14" ry="7" fill="#1a2138"/>
      </g>

      <!-- head: hair mass sits behind, offset up-and-back so it reads as a profile -->
      <circle cx="84" cy="33" r="20" fill="#1d1726"/>
      <circle cx="89" cy="40" r="17" fill="#f0c09a"/>
      <path d="M73 33 C78 20 95 17 104 26 C95 24 84 26 78 36 Z" fill="#1d1726"/>
      <circle cx="99" cy="42" r="1.8" fill="#2b2233"/>
      <path d="M105 44 q3.2 2 0 4" stroke="#d9a87f" stroke-width="1.4" fill="none" stroke-linecap="round"/>

      <!-- screen glow, behind the laptop, lighting the face -->
      <ellipse class="glow" cx="107" cy="74" rx="38" ry="32" fill="url(#screenGlow)"/>

      <!-- arm reaching to the keys -->
      <path d="M84 68 C78 82 78 95 90 101 L102 104" stroke="#8b7ad6" stroke-width="13" stroke-linecap="round" fill="none"/>
      <circle cx="104" cy="104" r="6" fill="#f0c09a"/>

      <!-- laptop -->
      <path d="M74 108 L128 100 L134 108 L80 116 Z" fill="#c9d3e6"/>
      <path d="M74 108 L128 100 L128 103 L74 111 Z" fill="#9fadc7"/>
      <path d="M127 100 L117 63 L126 61 L136 98 Z" fill="#b9c4da"/>
      <path d="M127 100 L117 63 L120 62.4 L130 99.5 Z" fill="#fbbf24" filter="url(#glowSm)" opacity="0.95"/>
      <circle cx="126" cy="82" r="2.4" fill="#8996b0"/>
    </g>

    <!-- front puff: the feet tuck into it so the figure sits *in* the cloud, not on a shelf -->
    <g transform="translate(160,200)">
      <circle cx="72"  cy="106" r="26" fill="#6480bd"/>
      <circle cx="124" cy="100" r="33" fill="#6b83c0"/>
      <circle cx="186" cy="106" r="28" fill="#647cb8"/>
      <circle cx="246" cy="110" r="23" fill="#5d74ae"/>
      <rect x="52" y="106" width="268" height="26" rx="13" fill="#5c74ac"/>
    </g>
  </g>

  <!-- ─── foreground drifting wisps ───────────────────────── -->
  <g opacity="0.22" fill="#a9bce8">
    <g class="drift-1"><use href="#cloudB" transform="translate(0,286) scale(.55)"/></g>
    <g class="drift-1" style="animation-delay:-24s"><use href="#cloudB" transform="translate(600,300) scale(.4)"/></g>
  </g>

  <!-- ─── identity block ──────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="600" y="122" fill="#7f8fb3" font-size="14" letter-spacing="2">$ whoami</text>
    <text x="600" y="172" fill="#eef3fb" font-size="44" font-weight="700" letter-spacing="1.5">Aadityasinh Zala</text>
    <text x="600" y="204" fill="#5ec8f5" font-size="16.5" letter-spacing="2.6">DevOps  ·  Cloud Infrastructure  ·  SRE</text>

    <line x1="600" y1="230" x2="1104" y2="230" stroke="#31406b" stroke-width="1"/>

    <!-- delivery pipeline -->
    <g transform="translate(600,248)">
      <g stroke="#3e5185" stroke-width="1.4" stroke-dasharray="3 4">
        <line x1="62"  y1="14" x2="88"  y2="14"/>
        <line x1="150" y1="14" x2="176" y2="14"/>
        <line x1="238" y1="14" x2="264" y2="14"/>
        <line x1="326" y1="14" x2="352" y2="14"/>
      </g>
      <g class="wire" stroke="#5ec8f5" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="10 34" opacity="0.9">
        <line x1="0" y1="14" x2="440" y2="14"/>
      </g>
      <g font-size="10.5" letter-spacing="1.2" text-anchor="middle">
        <g fill="#0f1729">
          <rect x="0"   y="2" width="62" height="24" rx="12" fill="#16203a" stroke="#3e5185"/>
          <rect x="88"  y="2" width="62" height="24" rx="12" fill="#16203a" stroke="#3e5185"/>
          <rect x="176" y="2" width="62" height="24" rx="12" fill="#16203a" stroke="#3e5185"/>
          <rect x="264" y="2" width="62" height="24" rx="12" fill="#16203a" stroke="#3e5185"/>
          <rect x="352" y="2" width="88" height="24" rx="12" fill="#16203a" stroke="#3e5185"/>
        </g>
        <g fill="#9db0d4">
          <text x="31"  y="18">push</text>
          <text x="119" y="18">build</text>
          <text x="207" y="18">scan</text>
          <text x="295" y="18">ship</text>
          <text x="396" y="18" fill="#4ade80">observe</text>
        </g>
      </g>
      <circle class="beat" cx="458" cy="14" r="4" fill="#4ade80"/>
    </g>
  </g>
</svg>
